apiVersion: v1
kind: Secret
metadata:
  name: deployhub-secrets
  namespace: deployhub
  labels:
    app.kubernetes.io/name: deployhub
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  SECRET_KEY: "deployhub-k8s-production-secret-key-change-me"
  POSTGRES_USER: "deployhub"
  POSTGRES_PASSWORD: "deployhub_secret_password"
  DATABASE_URL: "postgresql+asyncpg://deployhub:deployhub_secret_password@postgres-service:5432/deployhub"
  DATABASE_URL_SYNC: "postgresql://deployhub:deployhub_secret_password@postgres-service:5432/deployhub"
  ADMIN_EMAIL: "admin@deployhub.dev"
  ADMIN_PASSWORD: "AdminSecurePassword123!"
