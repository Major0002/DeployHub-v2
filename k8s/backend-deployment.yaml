apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: deployhub
  labels:
    app: deployhub-backend
    app.kubernetes.io/name: deployhub-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: deployhub-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: deployhub-backend
  template:
    metadata:
      labels:
        app: deployhub-backend
        app.kubernetes.io/name: deployhub-backend
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: init-db
          image: deployhub-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python database/init_db.py"]
          envFrom:
            - configMapRef:
                name: deployhub-config
            - secretRef:
                name: deployhub-secrets
      containers:
        - name: backend
          image: deployhub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: deployhub-config
            - secretRef:
                name: deployhub-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 10
