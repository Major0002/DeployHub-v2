  namespace: deployhub
  labels:
    app.kubernetes.io/name: deployhub-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: deployhub-platform
spec:
  type: ClusterIP
  selector:
    app: deployhub-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
