apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: deployhub
  labels:
    app: deployhub-frontend
    app.kubernetes.io/name: deployhub-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: deployhub-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: deployhub-frontend
  template:
    metadata:
      labels:
        app: deployhub-frontend
        app.kubernetes.io/name: deployhub-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: deployhub-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: deployhub-config
                  key: VITE_API_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
