apiVersion: v1
kind: ConfigMap
metadata:
  name: deployhub-config
  namespace: deployhub
  labels:
    app.kubernetes.io/name: deployhub
    app.kubernetes.io/component: configuration
data:
  APP_NAME: "DeployHub v2"
  APP_VERSION: "2.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "8000"
  CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:3000,http://deployhub.local"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "deployhub"
  VITE_API_URL: "/api/v1"
