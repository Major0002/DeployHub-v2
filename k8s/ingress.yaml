apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployhub-ingress
  namespace: deployhub
  labels:
    app.kubernetes.io/name: deployhub-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: deployhub-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: deployhub.local
      http:
        paths:
          # API traffic routed to FastAPI backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Health probes and checks routed to backend
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Frontend static and UI routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
