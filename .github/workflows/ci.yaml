name: CI Pipeline (Testing & Security Compliance)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Secret Scanning
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------------
  # 2. Security Compliance & Static Analysis (SAST / SCA)
  # --------------------------------------------------------------------------
  security-compliance:
    name: Security Compliance & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -r backend/ -ll -x backend/.venv,backend/tests

      - name: Audit Backend Dependencies (PyPA Advisory DB)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Trivy IaC / Kubernetes Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "k8s"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # --------------------------------------------------------------------------
  # 3. Containerized Backend Integration Testing
  # --------------------------------------------------------------------------
  backend-test-container:
    name: Backend Tests (PostgreSQL Test Container)
    runs-on: ubuntu-latest

    # Service Test Container for PostgreSQL 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deployhub_test
          POSTGRES_USER: deployhub
          POSTGRES_PASSWORD: deployhub_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployhub -d deployhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Live Test Container & Run Database Initialization
        env:
          DATABASE_URL: postgresql+asyncpg://deployhub:deployhub_secret@localhost:5432/deployhub_test
          DATABASE_URL_SYNC: postgresql://deployhub:deployhub_secret@localhost:5432/deployhub_test
          SECRET_KEY: test-secret-key-for-ci-pipeline
          ENVIRONMENT: test
        run: |
          cd backend
          python database/init_db.py

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://deployhub:deployhub_secret@localhost:5432/deployhub_test
          DATABASE_URL_SYNC: postgresql://deployhub:deployhub_secret@localhost:5432/deployhub_test
          SECRET_KEY: test-secret-key-for-ci-pipeline
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v

  # --------------------------------------------------------------------------
  # 4. Frontend Type Checking and Production Build Validation
  # --------------------------------------------------------------------------
  frontend-test:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Typecheck & Build
        working-directory: ./frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # 5. Kubernetes Manifest & Kustomize Validation
  # --------------------------------------------------------------------------
  k8s-validation:
    name: Kubernetes Manifest & Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kustomize Assembly
        run: |
          kubectl kustomize k8s/
