version: "3.9"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: deployhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: deployhub_secret
      POSTGRES_DB: deployhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deployhub-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://deployhub:deployhub_secret@db:5432/deployhub
      - DATABASE_URL_SYNC=postgresql://deployhub:deployhub_secret@db:5432/deployhub
      - SECRET_KEY=deployhub-production-secret-key-change-me-please
      - DEBUG=false
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python database/init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deployhub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
